<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quero Adotar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/CSS/style.css" />
</head>

<body>
    <main class="d-flex justify-content-center">
        <form class="w-50">
            <div class="form-row row">

                <div class="form-group col-md-12">
                    <label for="nome_completo">Nome Completo:</label>
                    <input type="text" class="form-control" id="nome_completo">
                </div>

                <div class="form-group col-md-3">
                    <label for="idade">Idade:</label>
                    <input type="number" class="form-control" id="idade">
                </div>

                <div class="form-group col-md-4">
                    <label for="cpf">CPF:</label>
                    <input type="text" class="form-control" id="cpf">
                </div>

                <div class="form-group col-md-5">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="form-group col-md-6">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="(31) 90000-0000">
                </div>

                <div class="form-group col-md-6">
                    <label for="endereco_completo">Endereço Completo:</label>
                    <input type="text" class="form-control" id="endereco_completo" placeholder="Rua Rosa 177">
                </div>

                <div class="mb-3">
                    <br>
                    <label class="form-label">Situação de Trabalho:</label>
                    <br>
                    <div class="form-check form-check-inline mb-1 p-4">
                        <input class="form-check-input" type="checkbox" id="situacao_empregado">
                        <label class="form-check-label small" for="situacao_empregado">Empregado</label>
                    </div>

                    <div class="form-check form-check-inline mb-1 p-4">
                        <input class="form-check-input" type="checkbox" id="situacao_desempregado">
                        <label class="form-check-label small" for="situacao_desempregado">Desempregado</label>
                    </div>

                    <div class="form-check form-check-inline mb-1 p-4">
                        <input class="form-check-input" type="checkbox" id="situacao_autonomo">
                        <label class="form-check-label small" for="situacao_autonomo">Autônomo</label>
                    </div>

                    <div class="form-check form-check-inline mb-1 p-4">
                        <input class="form-check-input" type="checkbox" id="situacao_estudante">
                        <label class="form-check-label small" for="situacao_estudante">Estudante</label>
                    </div>
                </div>
                <button type="submit" class="btn">Cadastrar</button>
            </div>
        </form>
    </main>

</body>

</html>
